<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d">
<title id="t">A document processing chain</title>
<desc id="d">A reverse engineering chain: a codebase flows through a splitter, linker, classifier, generator and validator, passing modules, linked modules, tagged modules and a business definition between them, and comes out as a validated spec. Four units are deterministic code, shown as cogs. The classifier uses a small, cheap LLM, shown as a plain brain. Above the chain, a smart AI, shown as a brain wearing a graduation cap, writes, tests and replaces every unit at build time.</desc>
<defs>
<filter id="rough" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1360" height="850">
  <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path class="head" d="M1,1.5 L10.5,6 L1,10.5"/></marker>
<marker id="ahm" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path class="headm" d="M1,1.5 L10.5,6 L1,10.5"/></marker>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.rough { filter: url(#rough); }
.ink { fill: none; stroke: #1a2526; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ink.thin { stroke-width: 1.5; }
.capfill { fill: #1e5f8c; stroke: #1e5f8c; }
.paper { fill: #fbfcfb; stroke: #6f817e; stroke-width: 1.6; stroke-linejoin: round; }
