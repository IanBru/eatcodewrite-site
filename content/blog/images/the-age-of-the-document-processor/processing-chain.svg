.det .ink { stroke: #4a5d5e; }
.ai .ring { fill: #fdf5e6; stroke: #c98a1b; stroke-width: 2.2; }
.ai .ink { stroke: #a86d0c; }
.smart .ink { stroke: #1e5f8c; stroke-width: 2.6; }
.flow { fill: none; stroke: #8a9b97; stroke-width: 2; stroke-linecap: round; }
.head { fill: none; stroke: #8a9b97; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.maint { fill: none; stroke: #1e5f8c; stroke-width: 1.8; stroke-dasharray: 7 6; stroke-linecap: round; opacity: 0.75; }
.headm { fill: none; stroke: #1e5f8c; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.name { fill: #1a2526; font-size: 17px; font-weight: 600; }
.name.ai { fill: #7a4f06; }
.name.smart { fill: #163d5c; font-size: 20px; }
.sub { fill: #4a5d5e; font-size: 14px; }
.dt { fill: #1a2526; font-size: 14px; }
.lbl { fill: #4a5d5e; font-size: 13px; font-style: italic; }
@media (prefers-color-scheme: dark) {
  .ink { stroke: #e4e9e7; }
  .capfill { fill: #6eb4e8; stroke: #6eb4e8; }
  .paper { fill: #1b201f; stroke: #5d6b68; }
  .det .ring { fill: #202624; stroke: #5d6b68; }
  .det .ink { stroke: #b4c0bd; }
  .ai .ring { fill: #2e2616; stroke: #e0a845; }
  .ai .ink { stroke: #f2c46d; }
  .smart .ink { stroke: #6eb4e8; }
  .flow, .head { stroke: #5d6b68; }
  .maint, .headm { stroke: #6eb4e8; }
  .name, .dt { fill: #e4e9e7; }
  .name.ai { fill: #f2c46d; }
  .name.smart { fill: #9ccaf5; }
  .sub, .lbl { fill: #8d9c98; }
}
</style>
