<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" role="img" aria-labelledby="t d">
<title id="t">A document processing chain</title>
<desc id="d">A reverse engineering chain at run time: a codebase goes through a splitter, linker, classifier, generator and validator, producing modules, linked modules, tagged modules, a business definition and finally a validated spec. Every unit is deterministic code except the classifier, which uses a small, cheap LLM. Above the chain, at build time, a smart frontier AI writes, tests and replaces each unit.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ahead" d="M0,1 L10,5 L0,9 z"/></marker>
<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="aheadm" d="M0,1 L10,5 L0,9 z"/></marker>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.lab { fill: #4a5d5e; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
.box { fill: #ffffff; stroke: #dce8e4; stroke-width: 1.5; }
.box.hl { fill: #f0f6fa; stroke: #1e5f8c; }
.box.ai { fill: #fdf5e6; stroke: #c98a1b; }
.doc { fill: #f7f9f8; stroke: #c4d3cf; stroke-width: 1.2; }
.fold { fill: none; stroke: #c4d3cf; stroke-width: 1.2; }
.bt { fill: #1a2526; font-size: 17px; font-weight: 600; }
.bt.hl { fill: #163d5c; }
.bt.ai { fill: #7a4f06; }
.bs { fill: #4a5d5e; font-size: 13px; }
.dt { fill: #1a2526; font-size: 13.5px; }
.arrow { stroke: #a9bab6; stroke-width: 1.5; fill: none; }
.ahead { fill: #a9bab6; }
.maint { stroke: #1e5f8c; stroke-width: 1.5; stroke-dasharray: 5 4; }
.aheadm { fill: #1e5f8c; }
@media (prefers-color-scheme: dark) {
  .lab, .bs { fill: #8d9c98; }
  .box { fill: #202624; stroke: #2d3432; }
  .box.hl { fill: #1a2432; stroke: #6eb4e8; }
  .box.ai { fill: #2e2616; stroke: #e0a845; }
  .doc { fill: #1b201f; stroke: #3a4441; }
  .fold { stroke: #3a4441; }
  .bt, .dt { fill: #e4e9e7; }
  .bt.hl { fill: #9ccaf5; }
  .bt.ai { fill: #f2c46d; }
  .arrow { stroke: #4f5c58; }
  .ahead { fill: #4f5c58; }
  .maint { stroke: #6eb4e8; }
  .aheadm { fill: #6eb4e8; }
}
</style>
</defs>

<!-- Row labels -->
<text class="lab" x="65" y="57" text-anchor="middle">BUILD TIME</text>
<text class="lab" x="65" y="186" text-anchor="middle">RUN TIME</text>

<!-- Smart AI -->
<rect class="box hl" x="137" y="20" width="636" height="64" rx="6"/>
<text class="bt hl" x="455" y="47" text-anchor="middle">Smart AI</text>
<text class="bs" x="455" y="69" text-anchor="middle">frontier model writes, tests and replaces each unit</text>

<!-- Maintenance lines -->
<line class="maint" x1="195" y1="86" x2="195" y2="146" marker-end="url(#ahm)"/>
<line class="maint" x1="325" y1="86" x2="325" y2="146" marker-end="url(#ahm)"/>
<line class="maint" x1="455" y1="86" x2="455" y2="146" marker-end="url(#ahm)"/>
<line class="maint" x1="585" y1="86" x2="585" y2="146" marker-end="url(#ahm)"/>
<line class="maint" x1="715" y1="86" x2="715" y2="146" marker-end="url(#ahm)"/>

<!-- Units -->
<rect class="box" x="137" y="150" width="116" height="62" rx="6"/>
<text class="bt" x="195" y="177" text-anchor="middle">Splitter</text>
<text class="bs" x="195" y="198" text-anchor="middle">deterministic</text>

<rect class="box" x="267" y="150" width="116" height="62" rx="6"/>
<text class="bt" x="325" y="177" text-anchor="middle">Linker</text>
<text class="bs" x="325" y="198" text-anchor="middle">deterministic</text>

<rect class="box ai" x="397" y="150" width="116" height="62" rx="6"/>
<text class="bt ai" x="455" y="177" text-anchor="middle">Classifier</text>
<text class="bs" x="455" y="198" text-anchor="middle">small LLM</text>

<rect class="box" x="527" y="150" width="116" height="62" rx="6"/>
<text class="bt" x="585" y="177" text-anchor="middle">Generator</text>
<text class="bs" x="585" y="198" text-anchor="middle">deterministic</text>

<rect class="box" x="657" y="150" width="116" height="62" rx="6"/>
<text class="bt" x="715" y="177" text-anchor="middle">Validator</text>
<text class="bs" x="715" y="198" text-anchor="middle">deterministic</text>

<!-- Documents (folded corner) -->
<path class="doc" d="M5,248 h108 l12,12 v36 h-120 z"/><path class="fold" d="M113,248 v12 h12"/>
<text class="dt" x="65" y="277" text-anchor="middle">Codebase</text>

<path class="doc" d="M135,248 h108 l12,12 v36 h-120 z"/><path class="fold" d="M243,248 v12 h12"/>
<text class="dt" x="195" y="277" text-anchor="middle">Modules</text>

<path class="doc" d="M265,248 h108 l12,12 v36 h-120 z"/><path class="fold" d="M373,248 v12 h12"/>
<text class="dt" x="325" y="277" text-anchor="middle">Linked modules</text>

<path class="doc" d="M395,248 h108 l12,12 v36 h-120 z"/><path class="fold" d="M503,248 v12 h12"/>
<text class="dt" x="455" y="277" text-anchor="middle">Tagged modules</text>

<path class="doc" d="M525,248 h108 l12,12 v36 h-120 z"/><path class="fold" d="M633,248 v12 h12"/>
<text class="dt" x="585" y="268" text-anchor="middle">Business</text>
<text class="dt" x="585" y="286" text-anchor="middle">definition</text>

<path class="doc" d="M655,248 h108 l12,12 v36 h-120 z"/><path class="fold" d="M763,248 v12 h12"/>
<text class="dt" x="715" y="277" text-anchor="middle">Validated spec</text>

<!-- Unit -> output document -->
<line class="arrow" x1="195" y1="214" x2="195" y2="244" marker-end="url(#ah)"/>
<line class="arrow" x1="325" y1="214" x2="325" y2="244" marker-end="url(#ah)"/>
<line class="arrow" x1="455" y1="214" x2="455" y2="244" marker-end="url(#ah)"/>
<line class="arrow" x1="585" y1="214" x2="585" y2="244" marker-end="url(#ah)"/>
<line class="arrow" x1="715" y1="214" x2="715" y2="244" marker-end="url(#ah)"/>

<!-- Document -> next unit -->
<line class="arrow" x1="105" y1="246" x2="150" y2="216" marker-end="url(#ah)"/>
<line class="arrow" x1="235" y1="246" x2="280" y2="216" marker-end="url(#ah)"/>
<line class="arrow" x1="365" y1="246" x2="410" y2="216" marker-end="url(#ah)"/>
<line class="arrow" x1="495" y1="246" x2="540" y2="216" marker-end="url(#ah)"/>
<line class="arrow" x1="625" y1="246" x2="670" y2="216" marker-end="url(#ah)"/>

<!-- Legend -->
<rect class="box" x="137" y="321" width="18" height="13" rx="3"/>
<text class="bs" x="163" y="332">deterministic code</text>
<rect class="box ai" x="310" y="321" width="18" height="13" rx="3"/>
<text class="bs" x="336" y="332">small, cheap LLM</text>
<line class="maint" x1="480" y1="327" x2="514" y2="327" marker-end="url(#ahm)"/>
<text class="bs" x="522" y="332">maintained by the smart AI</text>
</svg>
